video:
  max_dimension: 1280
frame_selection:
  strategy: target_fps
  target_fps: 0.5
gps:
  sync_method: nearest
  tolerance_seconds: 2.0

camera:
  model: SIMPLE_RADIAL
  parameters: null
  single_camera: true
colmap:
  use_gpu: true
  sequential_overlap: 8
segmentation:
  enabled: false
reconstruction:
  dense: false
  inferred_depth: false
  process_pointcloud: false
  mesh: false
