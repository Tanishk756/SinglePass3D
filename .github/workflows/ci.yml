name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  windows-python:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install test environment
        run: python -m pip install -e ".[dev,video,geospatial,viewer]"
      - name: Check dependencies
        run: python -m pip check
      - name: Lint
        run: python -m ruff check src tests scripts streamlit_app.py
      - name: Test
        run: python -m pytest -q
      - name: Build distributions
        run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: singlepass3d-dist
          path: dist/*

