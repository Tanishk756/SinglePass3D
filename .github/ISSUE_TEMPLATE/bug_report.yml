name: Bug report
description: Report a reproducible failure with non-sensitive diagnostics.
title: "[Bug]: "
labels: [bug]
body:
  - type: textarea
    attributes:
      label: What happened?
      description: Include the command, stage, and exact error. Do not upload sensitive imagery or credentials.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Environment
      description: Paste `singlepass3d doctor` output and the SinglePass3D version.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Reproduction steps
    validations:
      required: true

