[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "singlepass3d"
description = "Single-pass drone video to georeferenced 3D reconstruction"
readme = "README.md"
license = "MIT"
version = "1.3.1"
authors = [{name = "Tanishk Singhal"}]
requires-python = ">=3.11,<3.12"
dependencies = ["pydantic>=2,<3", "PyYAML>=6,<7"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Operating System :: Microsoft :: Windows :: Windows 11",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering :: Image Processing",
]

[project.urls]
Homepage = "https://github.com/Tanishk756/SinglePass3D"
Issues = "https://github.com/Tanishk756/SinglePass3D/issues"

[project.optional-dependencies]
dev = ["build>=1.2,<2", "pytest>=8,<9", "ruff>=0.6"]
video = ["opencv-python>=4.8,<5"]
geospatial = ["numpy>=1.24,<3", "pyproj>=3.5,<4"]
reconstruction = ["pycolmap>=3.10"]
ai = ["numpy>=1.24,<3", "torch>=2", "transformers>=4"]
pointcloud = ["numpy>=1.24,<3", "open3d>=0.18"]
mesh = ["trimesh>=4,<6"]
segmentation = ["numpy>=1.24,<3", "ultralytics>=8.3,<9"]
viewer = ["psutil>=5.9,<8", "streamlit>=1.57,<2"]

[project.scripts]
singlepass3d = "singlepass3d.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.package-data]
singlepass3d = ["viewer_assets/*"]
