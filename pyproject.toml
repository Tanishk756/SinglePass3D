[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "singlepass3d"
version = "0.1.0"
authors = [{name = "Tanishk Singhal"}]
requires-python = ">=3.11"
dependencies = ["pydantic>=2,<3", "PyYAML>=6,<7"]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.6"]
video = ["opencv-python>=4.8,<5"]
geospatial = ["numpy>=1.24,<3", "pyproj>=3.5,<4"]
reconstruction = ["pycolmap>=3.10"]

[project.scripts]
singlepass3d = "singlepass3d.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
