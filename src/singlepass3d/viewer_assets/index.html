<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SinglePass3D Viewer</title>
<style>:root{color-scheme:dark;font:14px system-ui;background:#0c1118;color:#dce7f3}*{box-sizing:border-box}body{margin:0;display:grid;grid-template-columns:280px 1fr;height:100vh}aside{padding:20px;background:#131c27;border-right:1px solid #29384a;overflow:auto}h1{font-size:20px;margin:0 0 6px}.sub{color:#8fa5ba;margin-bottom:22px}label{display:block;margin:12px 0}button{width:100%;padding:9px;background:#2463a8;color:white;border:0;border-radius:5px;cursor:pointer}canvas{width:100%;height:100%;display:block;background:linear-gradient(#172331,#080c12)}#status{white-space:pre-wrap;color:#9fb4c8;margin-top:16px;font-size:12px}.legend{margin-top:18px;border-top:1px solid #29384a;padding-top:12px}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:7px}.observed{background:#77d5ff}.gps{background:#ffcc66}.visual{background:#79ee9b}</style></head>
<body><aside><h1>SinglePass3D</h1><div class="sub" id="mission">Loading mission...</div><label><input id="points" type="checkbox" checked> Observed point cloud</label><label><input id="visual" type="checkbox" checked> Aligned visual trajectory</label><label><input id="gps" type="checkbox" checked> GPS trajectory</label><button id="reset">Reset view</button><div class="legend"><div><span class="dot observed"></span>Observed points</div><div><span class="dot visual"></span>Visual path</div><div><span class="dot gps"></span>GPS path</div></div><div id="status">Drag to orbit - wheel to zoom</div></aside><canvas id="view"></canvas><script src="/viewer.js"></script></body></html>
